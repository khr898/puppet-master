[project]
name = "puppet-master"
version = "0.1.0"
description = "MCP server that delegates bulk reads, writes and checks to a local or hosted worker model with enforced guardrails"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "khr898" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp>=1.2,<2",
]

[project.scripts]
puppet-master = "puppet_master.server:main"
puppet-stats = "puppet_master.stats:main"
puppet-eval = "puppet_master.eval:main"
puppet-savings = "puppet_master.savings:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: needs llama-server on :8000"]
addopts = "-m 'not live'"
testpaths = ["tests"]
